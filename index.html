<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>預約服務</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body { font-family: sans-serif; padding: 20px; background-color: #f7f7f7; }
    .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    h2 { text-align: center; color: #333; margin-bottom: 20px; }
    label { font-weight: bold; display: block; margin-top: 15px; margin-bottom: 5px; color: #555; }
    input, select, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 16px; }
    .checkbox-group { margin-top: 15px; font-size: 14px; color: #666; }
    .checkbox-group input { width: auto; margin-right: 8px; }
    button { width: 100%; background-color: #06C755; color: white; border: none; padding: 14px; font-size: 18px; font-weight: bold; border-radius: 6px; margin-top: 25px; cursor: pointer; }
    button:hover { background-color: #05b34c; }
  </style>
</head>
<body>

<div class="card">
  <h2>📅 線上預約</h2>

  <label for="name">預約人姓名</label>
  <input type="text" id="name" placeholder="請輸入姓名">

  <label for="phone">聯絡電話</label>
  <input type="tel" id="phone" placeholder="請輸入手機號碼">

  <label for="master">指定師父</label>
  <select id="master">
    <option value="不指定">不指定（由小編安排）</option>
    <option value="游師父">游師父</option>
    <option value="李師父">李師父</option>
    <option value="田師父">田師父</option>
    <option value="周師父">周師父</option>
    <option value="張師父">張師父</option>
  </select>

  <label for="date">希望預約日期</label>
  <input type="date" id="date">

  <label for="time">希望時段（可填多個）</label>
  <input type="text" id="time" placeholder="例如：14:00 或 19:00 後">

  <label for="source">如何得知本店？</label>
  <select id="source">
    <option value="網路">網路（搜尋 / 社群）</option>
    <option value="路過">路過</option>
    <option value="親友介紹">親友介紹</option>
  </select>

  <div class="checkbox-group">
    <label><input type="checkbox" id="rule1"> 我已了解限本人預約，恕不接受代約</label>
    <label><input type="checkbox" id="rule2"> 我已了解店內空間有限，陪同者限 1 位</label>
  </div>

  <button onclick="sendBooking()">確認送出預約</button>
</div>

<script>
  // LIFF 初始化（等我們拿到 LIFF ID 後再修改這行）
  liff.init({ liffId: "YOUR_LIFF_ID" }).catch(err => console.error(err));

  function sendBooking() {
    const name = document.getElementById('name').value;
    const phone = document.getElementById('phone').value;
    const master = document.getElementById('master').value;
    const date = document.getElementById('date').value;
    const time = document.getElementById('time').value;
    const source = document.getElementById('source').value;
    const rule1 = document.getElementById('rule1').checked;
    const rule2 = document.getElementById('rule2').checked;

    if (!name || !phone || !date || !time) {
      alert('請填寫完整資訊喔！');
      return;
    }

    if (!rule1 || !rule2) {
      alert('請勾選同意預約須知！');
      return;
    }

    const msg = `📩 【預約申請已送出】\n• 姓名：${name}\n• 電話：${phone}\n• 指定：${master}\n• 日期：${date}\n• 時段：${time}\n• 來源：${source}`;

    liff.sendMessages([{ type: 'text', text: msg }])
      .then(() => {
        alert('預約已送出！');
        liff.closeWindow();
      })
      .catch((err) => {
        alert('請在 LINE 裡面打開此網頁才能送出訊息喔！\n錯誤訊息：' + err);
      });
  }
</script>

</body>
</html>
